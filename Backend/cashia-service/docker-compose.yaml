services:
  cashia-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: cashia-service
    container_name: cashia-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ep-empty-resonance-b7lea85p-pooler.c-13.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
      SPRING_DATASOURCE_USERNAME: "neondb_owner"
      SPRING_DATASOURCE_PASSWORD: 'npg_tEhY2RrPvx4F'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  web:
    image: gailm/cashianext-web:latest
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      FAQ_API_URL: http://cashia-service:8080

volumes:
  postgres_data:
    driver: local;