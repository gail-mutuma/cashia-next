spring:
  application:
    name: cashia-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    generate-ddl: false
    hibernate.ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics





